services:
  bd:
    image: mariadb:12.3
    env_file: ".env"
    ports:
      - 3306:3306
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build: .
    env_file: ".env"
    ports:
      - 5001:5000
    depends_on:
      bd:
        condition: service_healthy

volumes:
  db_data: